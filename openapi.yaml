openapi: 3.0.3
info:
  title: YumYum user microservice - OpenAPI 3.0
  description: This is the OpenAPI 3.0 specification for the user microservice of the YumYum application.
  version: "1.1"
servers:
  - url: http://localhost:8081/
tags:
  - name: User
  - name: Customer
  - name: Admin
  - name: Vendor
  - name: Courier

paths:
  /user:
    post:
      tags:
        - User
      summary: Create a new user account
      description: Create a new account with date 
      operationId: createAccount
      requestBody: 
        description: user data
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
        required: true
      responses:
        '200':
          description: Successful operation         
        '400':
          description: Validation exception
        '409':
          description: User already exists
    get:
      tags:
        - user
      summary: Finds users by token
      description: Finds users by token
      operationId: getUserByToken
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'             
        '401':
          description: Unauthorised
        '404':
          description: User not found
      security:
        - bearerAuth: []
    put: 
      tags:
        - User
      summary: updates the user by token
      description: updates the user by token
      operationId: updateUserByToken
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'             
        '401':
          description: Unauthorised
        '404':
          description: User not found
      security:
        - bearerAuth: []

  /customer/info:
    put:
      tags:
        - Customer
      summary: Update the information of the current customer
      description: Update the information of the current customer by providing new object
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Customer'
      responses:
        '200':
          description: succesful operation
        '401':
          description: unauthorized
      security:
        - bearerAuth: []
    get:
      tags:
        - Customer
      summary: Get the information of the current customer
      description: Get the information of the current customer by providing new object
      responses:
        '200':
          description: succesful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '401':
          description: unauthorized
      security:
        - bearerAuth: [] 
  /customer/order:
    put:
      tags:
        - Customer
      summary: Update the list of current orders
      description: Update the list of current orders by providing a new list of orderIDs
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: integer
                format: int32
      responses:
        '200':
          description: succesful operation
        '401':
          description: unauthorized
      security:
        - bearerAuth: [] 
    get:
      tags:
        - Customer
      summary: Returns the list of current orders
      description: Returns the list of current order Ids
      responses:
        '200':
          description: succesful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  type: integer
                  format: int32
        '401':
          description: unauthorized
      security:
        - bearerAuth: [] 
  /customer/feedback:
    post:
      tags:
        - Customer
      summary: Add feedback
      description: Add feedback to courier / vendor
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Feedback'
      responses:
        '200':
          description: succesful operation
        '400':
          description: invalid feedback format
        '401':
          description: unauthorized
      security:
        - bearerAuth: [] 
  /courier/info:
    put:
      tags:
        - Courier
      summary: Update the information of the current courier
      description: Update the information of the current courier by providing new object
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Courier'
      responses:
        '200':
          description: succesful operation
        '401':
          description: unauthorized
      security:
        - bearerAuth: []
    get:
      tags:
        - Courier
      summary: Get the information of the current courier
      description: Get the information of the current courier by providing new object
      responses:
        '200':
          description: succesful operation
          content:
            application/json:
              schema: 
                $ref: '#/components/schemas/Courier'
        '401':
          description: unauthorized
      security:
        - bearerAuth: [] 
  /courier/order:
    put:
      tags:
        - Courier
      summary: Update the list of current orders
      description: Update the list of current orders by providing a new list of orderIDs
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: integer
                format: int32
      responses:
        '200':
          description: succesful operation
        '401':
          description: unauthorized
      security:
        - bearerAuth: [] 
    get:
      tags:
        - Courier
      summary: Returns the list of current orders
      description: Returns the list of current order Ids
      responses:
        '200':
          description: succesful operation
          content:
            application/json:
              schema:
                items:
                  type: integer
                  format: int32
        '401':
          description: unauthorized
      security:
        - bearerAuth: [] 
  /courier/feedback:
    get:
      tags:
        - Courier
      summary: Get feedback
      description: Get all received feedback
      responses:
        '200':
          description: succesful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Feedback'
        '401':
          description: unauthorized
      security:
        - bearerAuth: [] 
  /vendor:
    post:
      tags:
        - Vendor
      summary: Create a new Vendor account
      description: Create a new Vendor account 
      operationId: createVendor()
      requestBody: 
        description: vendor data
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Vendor'
        required: true
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vendor'          
        '400':
          description: Vendor already exists!
        '405':
          description: Validation exception
    put:
      tags:
        - Courier
      summary: Updates a wallet by courier user id
      description: Updates a wallet by courier user id
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Wallet'
      responses:
        '200':
          description: succesful operation
        '401':
          description: unauthorized
        '404':
          description: Wallet not found
      security:
        - bearerAuth: []

  /feedback:
    get:
      tags:
        - Feedback
      summary: Finds feedback by id
      description: Finds feedback by id
      operationId: getFeedbackByID
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Feedback'             
        '401':
          description: Unauthorised
        '404':
          description: Feedback not found
      security:
        - bearerAuth: []
  /validation/{vendorID}:
    post:
      tags:
        - Vendor
      summary: post a validation document
      description: post a validation document
      parameters:
        - name: vendorID
          in: path
          description: ID of vendor 
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        description: document proving that the restaurant belongs to a vendor
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Validation'
        required: true
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Validation'          
        '400':
          description: Invalid token supplied
        '404':
          description: Validation not found
        '405':
          description: Validation exception
      security:
       - bearerAuth: []
  
    get:
      tags:
        - Vendor
      summary: get a validation document
      description: get validation document
      # not sure how to have bith body and parameter
      parameters:
        - name: vendorID
          in: path
          description: ID of vendor 
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Validation'          
        '400':
          description: Invalid token supplied
        '404':
          description: Validation not found
        '405':
          description: Validation exception
          
      security:
       - bearerAuth: []  
    delete:
      tags:
        - Vendor
      summary: delete a validation document
      description: delete validation document
      # not sure how to have bith body and parameter
      parameters:
        - name: vendorID
          in: path
          description: ID of vendor 
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Validation'          
        '400':
          description: Invalid token supplied
        '404':
          description: Validation not found
        '405':
          description: Validation exception
      security:
        - bearerAuth: []

components:
  schemas:
    Validation:
      type: object
      properties:
        document:
          type: string
          description: document proving that a restaurant belongs to a specific vendor
    User:
      type: object
      properties:
        name:
          type: string
        surname:
          type: string
        id:
          type: integer
          format: int32
        email:
          type: string
    Feedback:
      type: object
      properties:
        id:
          type: integer
          format: int32
        orderId:
          type: integer
          format: int32
          nullable: true
        stars:
          type: integer
          format: int32
        comment:
          type: string
        complaint:
          type: boolean
    Courier:
      type: object
      properties:
        userId:
          type: integer
          format: int32
        rating:
          type: number
          format: float
        pastOrders:
          type: array
          items:
            type: integer
            format: int32
          description: array of ids of orders
        feedback:
          type: array
          items:
            type: integer
            format: int32
          description: array of ids of feedbacks
    Customer:
      type: object
      properties:
        userId:
          type: integer
          format: int32
        homeAddress:
          type: string
        allergens:
          type: array
          items:
            type: string
        paymentMethod:
          type: array
          items:
            $ref: '#/components/schemas/PaymentMethod'
        orderHistory:
          items:
            type: integer
            format: int32
          description: array of ids of orders

    PaymentMethod:
      type: object
      properties:
        credit card number:
          type: string
        cardholder name:
          type: string
        date:
          type: string
        cvv code:
          type: integer
          format: int32
    Vendor:
      type: object
      properties:
        userId:
          type: integer
          format: int32
        location:
          type: string
        opening time:
          type: string
        feedbacks:
          type: array
          items:
            type: integer
            format: int32
          description: list of ids
    Wallet:
      type: object
      properties:
          balance:
            type: number
            format: float
          iban:
            type: string
  securitySchemes:
    bearerAuth:   
      type: http
      scheme: bearer
      bearerFormat: JWT