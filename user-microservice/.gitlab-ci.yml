image: gradle:6.7-jdk15

stages:
  - build
  - staticAnalysis
  - test

variables:
  # Disable the Gradle daemon to ensure isolated runs of the CI pipeline.
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

# Default build cache settings to extend from
.build_cached:
  cache:
    key: "gradle-build"
    paths:
      # Only cache the gradle directory, as we do not use a shared cache
      - .gradle/
    policy: pull

build-user-microservice:
  extends:
    - .build_cached
  needs:
    - gradle_build
  dependencies:
    - gradle_build
  stage: build
  script:
    gradle user-microservice:assemble user-microservice:testClasses

checkStyle-user-microservice:
  extends:
    - .build_cached
  needs:
    - gradle_build
  dependencies:
    - gradle_build
  stage: staticAnalysis
  script:
    gradle user-microservice:checkstyleMain user-microservice:checkStyleTest -DfailCheckstyle
  after_script:
    - bash config/gitlab-ci/parse-checkstyle.sh -c user-microservice/build/reports/checkstyle/main.xml -p user-microservice/build/reports/pmd/main.xml gl-code-quality-report.json
  allow_failure: true
  artifacts:
    reports:
      codequality: gl-code-quality-report.json

PMD-user-microservice:
  extends:
    - .build_cached
  needs:
    - gradle_build
  dependencies:
    - gradle_build
  stage: staticAnalysis
  script:
    gradle user-microservice:pmdMain -DfailPMD
  allow_failure: true

test-user-microservice:
  extends:
    - .build_cached
  needs:
    - gradle_build
  dependencies:
    - gradle_build
  stage: test
  script:
    - gradle user-microservice:test user-microservice:jacocoTestReport
    - cat user-microservice/build/reports/jacoco/test/html/index.html | grep -Po "Total.*?([0-9]{1,3})%"
  coverage: /([0-9]{1,3})%/
  artifacts:
    when: always
    reports:
      junit: user-microservice/build/test-results/test/**/TEST-*.xml
    paths:
      - user-microservice/build/reports/jacoco/test/jacocoTestReport.xml

coverage-report:
  stage: test
  image: registry.gitlab.com/haynes/jacoco2cobertura:1.0.9
  script:
    # convert report from jacoco to cobertura, using relative project path
    - python /opt/cover2cover.py $PWD/user-microservice/build/reports/jacoco/test/jacocoTestReport.xml $PWD/user-microservice/src/main/java/ > cobertura.xml
  needs: ["test-user-microservice"]
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: cobertura.xml
