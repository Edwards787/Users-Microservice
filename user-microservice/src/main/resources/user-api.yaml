openapi: 3.0.3
info:
  title: YumYum user microservice - OpenAPI 3.0
  description: This is the OpenAPI 3.0 specification for the user microservice of the YumYum application.
  version: "1.1"
servers:
  - url: http://localhost:8081/
tags:
  - name: User
  - name: Customer
  - name: Admin
  - name: Vendor
  - name: Courier

paths:

  #____USER____
  /user/all:
    get:
      tags:
        - User
      summary: Returns all users
      description: Returns a list of all 'User' objects currently present in the database
      operationId: getAllUsers
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
  /user/byEmail/{email}:
    parameters:
      - name: email
        in: path
        description: Email of the user to be retrieved
        required: true
        schema:
          type: string
        example: "johndoe@example.com"
    get:
      tags:
        - User
      summary: Finds user by email
      description: Finds user by email, returning a complete matching 'User' object
      operationId: getUserByEmail
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Request doesn't respect the schema
        '404':
          description: User not found
  /user/{userId}:
    parameters:
      - name: userId
        in: path
        description: user ID corresponding to value in database
        required: true
        schema:
          type: integer
          format: int64
        example: 1
    get:
      tags:
        - User
      summary: Finds user by id
      description: Finds user by id, returning a complete matching 'User' object
      operationId: getUserById
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: User not found

  #____CUSTOMER____
  /customer/all:
    get:
      tags:
        - Customer
      summary: Finds all Customers
      description: Returns a list of all Customer objects in the database
      operationId: getAllCustomers
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Customer'
  /customer:
    post:
      tags:
        - Customer
      summary: Create a new Customer account
      description: Create a new Customer account, by providing the necessary data (some other information will be set up by the server)
      operationId: createCustomer
      requestBody:
        description: customer data
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerRequestModel'
        required: true
      responses:
        '201': #Created
          description: Customer created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400':
          description: Request doesn't respect the schema
        '409':
          description: Customer with that email already exists
  /customer/{userId}:
    parameters:
      - name: userId
        in: path
        description: user ID of customer
        required: true
        schema:
          type: integer
          format: int64
        example: 1
    put:
      tags:
        - Customer
      summary: Update the information of the current customer
      description: Update the information of the current customer by providing object with new info (null means stay the same)
      operationId: updateCustomer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerRequestModel'
      responses:
        '200':
          description: Customer updated
        '400':
          description: Request doesn't respect the schema
        '404':
          description: Customer not found
    get:
      tags:
        - Customer
      summary: Get customer by id
      description: Get customer by id
      operationId: getCustomerById
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '404':
          description: Customer not found
    delete:
      tags:
        - Customer
      summary: Delete a customer by id
      description: Delete a customer by id
      operationId: deleteCustomer
      responses:
        '200':
          description: Customer deleted
        '404':
          description: Customer not found
  /customer/{userId}/ongoingOrders:
    parameters:
      - name: userId
        in: path
        description: user ID of customer
        required: true
        schema:
          type: integer
          format: int64
        example: 1
    get:
      tags:
        - Customer
      summary: Returns the list of current orders
      description: Returns the list of current order Ids
      operationId: getCurrentOrderIdsForUser
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                type: array
                items:
                  type: integer
                  format: int64
              example:
                - 1
                - 2
        '404':
          description: Customer not found
  /customer/{userId}/currentLocation:
    parameters:
      - name: userId
        in: path
        description: user ID of customer
        required: true
        schema:
          type: integer
          format: int64
        example: 1
    get:
      tags:
        - Customer
      summary: Returns current location of the customer
      description: Returns current location of the customer
      operationId: getCurrentLocationForUser
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Location'
        '404':
          description: Customer not found
  /customer/{userId}/savedOrder:
    parameters:
      - name: userId
        in: path
        description: user ID of customer
        required: true
        schema:
          type: integer
          format: int64
        example: 1
    get:
      tags:
        - Customer
      summary: Returns the saved past order
      description: Returns the saved past order
      operationId: getPastSavedOrderIdForUser
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                type: integer
                format: int64
              example: 1
        '404':
          description: Customer not found
    put:
      tags:
        - Customer
      summary: updates the saved past order
      description: updates the saved past order
      operationId: updatePastSavedOrderIdForUser
      requestBody:
        content:
          application/json:
            schema:
              type: integer
              format: int64
            example: 1
      responses:
        '200':
          description: Successful
        '404':
          description: Customer not found
  /customer/{userId}/requestRefund/{orderId}:
    parameters:
      - name: userId
        in: path
        description: user ID of customer
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      - name: orderId
        in: path
        description: user ID of customer
        required: true
        schema:
          type: integer
          format: int64
        example: 1

    put:
      tags:
        - Customer
      summary: Request Refund
      description: updates an order to want a refund
      operationId: requestRefundByCustomerIdForOrderId
      responses:
        '200':
          description: Successful
        '404':
          description: order not found
  /customer/{userId}/favRestaurants:
    parameters:
      - name: userId
        in: path
        description: user ID of customer
        required: true
        schema:
          type: integer
          format: int64
        example: 1
    get:
      tags:
        - Customer
      summary: returns a list of favourite restaurants
      description: returns a list of favourite restaurants
      operationId: getFavouriteVendorIdsForCustomer
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                type: array
                items:
                  type: integer
                  format: int64
              example:
                - 1
                - 2
        '404':
          description: Customer not found
    put:
      tags:
        - Customer
      summary: updates a list of favourite restaurants
      description: updates a list of favourite restaurants
      operationId: updateFavouriteVendorIdsForCustomer
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: integer
                format: int64
            example:
              - 1
              - 2
      responses:
        '200':
          description: Successful operation
        '404':
          description: Customer not found
  /customer/{userId}/favOrders:
    parameters:
      - name: userId
        in: path
        description: user ID of customer
        required: true
        schema:
          type: integer
          format: int64
        example: 1
    get:
      tags:
        - Customer
      summary: returns a list of favourite orders
      description: returns a list of favourite orders
      operationId: getFavouriteOrderIdsForCustomer
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                type: array
                items:
                  type: integer
                  format: int64
              example:
                - 1
                - 2
        '404':
          description: Customer not found
    put:
      tags:
        - Customer
      summary: updates a list of favourite orders
      description: updates a list of favourite orders
      operationId: updateFavouriteOrderIdsForCustomer
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: integer
                format: int64
            example: 
              - 1
              - 2
      responses:
        '200':
          description: Successful
        '404':
          description: Customer not found
  /customer/{userId}/block:
    parameters:
      - name: userId
        in: path
        description: user ID of customer
        required: true
        schema:
          type: integer
          format: int64
        example: 1
    put:
      tags:
        - Customer
      summary: Block/unblock a customer
      description: Block/unblock a customer
      operationId: updateCustomerBlockStatus
      requestBody:
        description: block/unblock a customer
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlockRequestModel'
        required: true
      responses:
        '200':
          description: Updated succesfully
        '400':
          description: Request doesn't respect the schema
        '401':
          description: Unauthorized - not an admin

  #____COURIER____
  /courier/all:
    get:
      tags:
        - Courier
      summary: Finds all Couriers
      description: returns all couriers
      operationId: getAllCouriers
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Courier'
  /courier:
    post:
      tags:
        - Courier
      summary: Create a new Courier account
      description: Create a new Courier account
      operationId: createCourier
      requestBody:
        description: courier data
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourierRequestModel'
        required: true
      responses:
        '201': # Created
          description: Courier created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Courier'
        '400':
          description: Request doesn't respect the schema
        '409':
          description: Courier with that email already exists
  /courier/{userId}:
    parameters:
      - name: userId
        in: path
        description: user ID of courier
        required: true
        schema:
          type: integer
          format: int64
        example: 1
    put:
      tags:
        - Courier
      summary: Update the information of the current Courier
      description: Update the information of the current courier by providing new object (null means stay the same)
      operationId: updateCourier
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Courier'
      responses:
        '200':
          description: Courier updated
        '400':
          description: Request doesn't respect the schema
        '404':
          description: Courier not found
    get:
      tags:
        - Courier
      summary: Get courier by id
      description: Get courier by id
      operationId: getCourierById
      responses:
        '200':
          description: Courier found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Courier'
        '404':
          description: Courier not found
    delete:
      tags:
        - Courier
      summary: Delete a courier by id
      description: Delete a courier by id
      operationId: deleteCourier
      responses:
        '200':
          description: Courier deleted
        '404':
          description: Courier not found
  /courier/{userId}/pastOrders:
    parameters:
      - name: userId
        in: path
        description: user ID of courier
        required: true
        schema:
          type: integer
          format: int64
        example: 1
    get:
      tags:
        - Courier
      summary: Returns the list of past orders
      description: Returns the list of past order Ids
      operationId: getPastOrderIdsForCourier
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                items:
                  type: integer
                  format: int64
              example:
                - 1
                - 2
  /courier/{userId}/ratings:
    parameters:
      - name: userId
        in: path
        description: user ID of courier
        required: true
        schema:
          type: integer
          format: int64
        example: 1
    get:
      tags:
        - Courier
      summary: Returns the list of ratings
      description: Returns the list of past order Ids
      operationId: getRatingsForCourier
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/Rating'
    put:
      tags:
        - Courier
      summary: Update the list of ratings (admin only)
      description: Update the list of ratings
      operationId: updateRatingsForCourier
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  description: User Id of the user issuing the update
                  type: integer
                  format: int64
                ratings:
                  type: array
                  items:
                    $ref: '#/components/schemas/Rating'
            example:
              userId: 0
              ratings:
                - userId: 1
                  rating: 5
      responses:
        '200':
          description: successful operation
        '404':
          description: courier not found
  /courier/{userId}/rate:
    parameters:
      - name: userId
        in: path
        description: user ID of courier
        required: true
        schema:
          type: integer
          format: int64
        example: 1
    post:
        tags:
            - Courier
        summary: Post a rating
        description: Post a rating
        operationId: rateCourier
        requestBody:
          description: Rating
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rating'
          required: true
        responses:
          '201': # Created
            description: Rating uploaded
          '400':
            description: Request doesn't respect the schema
          '404':
            description: Courier not found
  # This is only accessed by admin
  /courier/{userId}/activation:
    parameters:
      - name: userId
        in: path
        description: user ID of courier
        required: true
        schema:
          type: integer
          format: int64
        example: 1
    put:
      tags:
        - Courier
      summary: Update activation of a courier
      description: Update activation of a courier
      operationId: updateCourierActivationStatus
      requestBody:
        description: Updates the activation of a courier
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivationRequestModel'
        required: true
      responses:
        '200':
          description: Updated successfully
        '400':
          description: Request doesn't respect the schema
        '401':
          description: Unauthorized - not an admin
  # This is only accessed by admin
  /courier/{userId}/block:
    parameters:
      - name: userId
        in: path
        description: user ID of courier
        required: true
        schema:
          type: integer
          format: int64
        example: 1
    put:
      tags:
        - Courier
      summary: Block/unblock a courier
      description: Block/unblock a courier
      operationId: updateCourierBlockStatus
      requestBody:
        description: block/unblock a courier
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlockRequestModel'
        required: true
      responses:
        '200':
          description: Updated succesfully
        '400':
          description: Request doesn't respect the schema
        '401':
          description: Unauthorized - not an admin

  #____VENDOR____
  /vendor/all:
    get:
      tags:
        - Vendor
      summary: Finds all Vendors
      description: returns all vendors
      operationId: getAllVendors
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Vendor'
  /vendor:
    post:
      tags:
        - Vendor
      summary: Create a new Vendor account
      description: Create a new Vendor account
      operationId: createVendor
      requestBody:
        description: vendor data
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VendorRequestModel'
        required: true
      responses:
        '201': # Created
          description: Vendor created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vendor'
        '400':
          description: Request doesn't respect the schema
        '409':
          description: Vendor with that email already exists
  /vendor/{userId}:
    parameters:
      - name: userId
        in: path
        description: user ID of vendor
        required: true
        schema:
          type: integer
          format: int64
        example: 1
    put:
      tags:
        - Vendor
      summary: Update the information of the current Vendor
      description: Update the information of the current vendor by providing new object (null means stay the same)
      operationId: updateVendor
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VendorRequestModel'
      responses:
        '200':
          description: Vendor updated
        '400':
          description: Request doesn't respect the schema
        '404':
          description: Vendor not found
    get:
      tags:
        - Vendor
      summary: Get the information of the current vendor
      description: Get the information of the current vendor by providing id
      operationId: getVendorById
      responses:
        '200':
          description: Vendor found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vendor'
        '404':
          description: Vendor not found
    delete:
      tags:
        - Vendor
      summary: Delete a vendor by id
      description: Delete a vendor by id
      operationId: deleteVendor
      responses:
        '200':
          description: Vendor deleted
        '404':
          description: Vendor not found
  /vendor/byRadius:
    get:
      tags:
        - Vendor
      summary: Get vendors by radius
      description: Get vendors by radius
      operationId: getVendorsByRadius
      parameters:
        - name: radius
          in: query
          description: radius in km
          required: true
          schema:
            type: integer
            format: int64
          example: 5
        - name: latitude
          in: query
          description: location's latitude
          required: true
          schema:
            type: number
            format: float
          example: 41.902782
        - name: longitude
          in: query
          description: location's longitude
          required: true
          schema:
            type: number
            format: float
          example: 21.496366
      responses:
        '200':
          description: Vendors found
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Vendor'
        '400':
          description: Request doesn't respect the schema
        '404':
          description: Vendors not found
  /vendor/{userId}/validation:
    parameters:
      - name: userId
        in: path
        description: user ID of vendor
        required: true
        schema:
          type: integer
          format: int64
        example: 1
    post:
      tags:
        - Vendor
      summary: Post a validation document
      description: Post a validation document
      operationId: uploadValidationByVendor
      requestBody:
        description: Document proving that the restaurant belongs to a vendor
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidationRequestModel'
        required: true
      responses:
        '201': # Created
          description: Validation uploaded
        '400':
          description: Request doesn't respect the schema
        '404':
          description: Vendor not found
    put:
      tags:
        - Vendor
      summary: Update a validation document
      description: Update a validation document
      operationId: updateValidationByVendor
      requestBody:
        description: Document proving that the restaurant belongs to a vendor
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidationRequestModel'
        required: true
      responses:
        '200':
          description: Validation uploaded
        '400':
          description: Request doesn't respect the schema
        '404':
          description: Vendor not found
    get:
      tags:
        - Vendor
      summary: Get a validation document
      description: Get validation document
      operationId: getValidationByVendor
      responses:
        '200':
          description: Validation found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Validation'
        '404':
          description: Validation or vendor not found
    delete:
      tags:
        - Vendor
      summary: Delete a validation document
      description: Delete validation document
      operationId: deleteValidationByVendor
      responses:
        '200':
          description: Validation deleted
        '404':
          description: Validation or vendor not found
  /validation/all:
    get:
      tags:
        - Vendor
      summary: Get all validation documents
      description: Get all validation documents
      operationId: getAllValidations
      responses:
        '200':
          description: Validations found
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ActivationRequestModel'
  # This is only accessed by admin
  /vendor/{userId}/activation:
    parameters:
      - name: userId
        in: path
        description: user ID of vendor
        required: true
        schema:
          type: integer
          format: int64
        example: 1
    put:
      tags:
        - Vendor
      summary: Update activation of a vendor
      description: Update activation of a vendor
      operationId: updateVendorActivationStatus
      requestBody:
        description: Updates the activation of a vendor
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Validation'
        required: true
      responses:
        '200':
          description: Updated successfully
        '400':
          description: Request doesn't respect the schema
        '401':
          description: Unauthorized - not an admin
  # This is only accessed by admin
  /vendor/{userId}/block:
    parameters:
      - name: userId
        in: path
        description: user ID of vendor
        required: true
        schema:
          type: integer
          format: int64
        example: 1
    put:
      tags:
        - Vendor
      summary: Block/unblock a vendor
      description: Block/unblock a vendor
      operationId: updateVendorBlockStatus
      requestBody:
        description: block/unblock a vendor
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlockRequestModel'
        required: true
      responses:
        '200':
          description: Updated succesfully
        '400':
          description: Request doesn't respect the schema
        '401':
          description: Unauthorized - not an admin


  #____ADMIN____
  /admin:
    post:
      tags:
        - Admin
      summary: Create a new Admin account
      description: Create a new Admin account (only accessible by admins)
      operationId: createAdmin
      requestBody:
        description: admin data
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminRequestModel'
        required: true
      responses:
        '201': #Created
          description: Admin created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Admin'
        '400':
          description: Request doesn't respect the schema
        '409':
          description: Admin with that email already exists
  /admin/{userId}:
    parameters:
      - name: userId
        in: path
        description: user ID of admin
        required: true
        schema:
          type: integer
          format: int64
        example: 1
    put:
      tags:
        - Admin
      summary: Update the information of the current admin
      description: Update the information of the current admin by providing object with new info (null means stay the same)
      operationId: updateAdmin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminRequestModel'
      responses:
        '200':
          description: Admin updated
        '400':
          description: Request doesn't respect the schema
        '404':
          description: Admin not found
    get:
      tags:
        - Admin
      summary: Get the information of the current Admin
      description: Get the information of the current Admin
      operationId: getAdminById
      responses:
        '200':
          description: Admin found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Admin'
        '404':
          description: Admin not found
    delete:
      tags:
        - Admin
      summary: Delete an admin by id
      description: Delete an admin by id
      operationId: deleteAdmin
      responses:
        '200':
          description: Admin deleted
        '404':
          description: Admin not found
  /admin/{userId}/refunds:
    parameters:
      - name: userId
        in: path
        description: user ID of admin
        required: true
        schema:
          type: integer
          format: int64
        example: 1
    get:
      tags:
        - Admin
      summary: Get a list of orders to be refunded
      description: Get the list of orders that have the refund tag set to true
      operationId: getRefundRequests
      responses:
        '200':
          description: Orders found
          content:
            application/json:
              schema:
                type: array
                items:
                  type : integer
                  format : int64
              example:
                - 1
                - 2
        '404':
          description: Request Error
  /admin/{userId}/refund/{orderId}:
    parameters:
      - name: userId
        in: path
        description: user ID of admin
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      - name: orderId
        in: path
        description: user ID of admin
        required: true
        schema:
          type: integer
          format: int64
        example: 2
    put:
      tags:
        - Admin
      summary : Approve or decline a refund
      description: Approve or decline a refund and do said refund
      operationId: updateRefundRequestStatus
      requestBody:
        description: Refund or not
        content:
          application/json:
            schema:
              type: boolean
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                type: integer
                format: int64
        '404':
          description: Order / Admin Not found

  #____FEEDBACK____
  /feedback/all:
    get:
      tags:
        - Feedback
      summary: Get all feedbacks
      description: Get all feedbacks
      operationId: getAllFeedbacks
      responses:
        '200':
          description: Feedbacks found
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Feedback'
  /feedback:
    post:
      tags:
        - Feedback
      summary: Post a feedback
      description: Post a feedback
      operationId: createFeedback
      requestBody:
        description: Feedback
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackRequestModel'
        required: true
      responses:
        '201': # Created
          description: Feedback uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Feedback'
        '400':
          description: Request doesn't respect the schema
  /feedback/{feedbackId}:
    parameters:
      - name: feedbackId
        in: path
        description: feedback ID
        required: true
        schema:
          type: integer
          format: int64
        example: 1
    get:
      tags:
        - Feedback
      summary: Get a feedback
      description: Get a feedback
      operationId: getFeedbackById
      responses:
        '200':
          description: Feedback found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Feedback'
        '404':
          description: Feedback not found
    delete:
      tags:
        - Feedback
      summary: Delete a feedback
      description: Delete a feedback
      operationId: deleteFeedback
      responses:
        '200':
          description: Feedback deleted
        '404':
          description: Feedback not found

components:
  schemas:
    #_______________REQUEST_MODELS____________________
    UserRequestModel:
      type: object
      required:
        - email
        - name
        - surname
      properties:
        email:
          type: string
        name:
          type: string
        surname:
          type: string
      example:
        email: "johndoe@example.com"
        name: "John"
        surname: "Doe"
    CustomerRequestModel:
      allOf:
        - $ref: '#/components/schemas/UserRequestModel'
      type: object
      required:
        - homeAddress
        - allergens
        - paymentMethods
      properties:
        homeAddress:
          $ref: '#/components/schemas/Address'
        allergens:
          type: array
          items:
            type: string
        paymentMethods:
          type: array
          items:
            $ref: '#/components/schemas/PaymentMethod'
      example:
        email: "johndoe@example.com"
        name: "John"
        surname: "Doe"
        homeAddress:
          address: "Via Roma 1"
          city: "Roma"
          country: "Italy"
          postalCode: "00100"
          coordinates:
            lat: 41.902782
            long: 12.496366
        allergens:
          items:
            - "nuts"
        paymentMethods:
          items:
            - creditCardNumber: "1234567890123456"
              cardholderName: "John Doe"
              date: "01/01/2021"
              cvvCode: 123
    VendorRequestModel:
      allOf:
        - $ref: '#/components/schemas/UserRequestModel'
      type: object
      required:
        - address
        - openingTimes
        - closingTimes
      properties:
        address:
          $ref: '#/components/schemas/Address'
        openingTimes:
          type: string
        closingTimes:
          type: string
      example:
        name: John
        surname: Doe
        email: "johndoe@example.com"
        address:
          address: "Via Roma 1"
          city: "Roma"
          country: "Italy"
          postalCode: "00100"
          coordinates:
            lat: 41.902782
            long: 12.496366
        openingTimes: "mon-fri 10:00, sat-sun 12:00"
        closingTimes: "mon-fri 20:00, sat-sun 22:00"
    CourierRequestModel:
      allOf:
        - $ref: '#/components/schemas/UserRequestModel'
      type: object
      properties:
        ibanNumber:
          type: string
      example:
        name: John
        surname: Doe
        email: "johndoe@example.com"
        ibanNumber: "IT60X0542811101000000123455"
    AdminRequestModel:
      allOf:
        - $ref: '#/components/schemas/UserRequestModel'
      example:
        name: John
        surname: Doe
        email: "johndoe@example.com"

    FeedbackRequestModel:
      type: object
      required:
        - stars
        - comment
        - complaint
      properties:
        userId:
          type: integer
          format: int64
        stars:
          type: integer
          format: int64
        comment:
          type: string
        complaint:
          type: boolean
      example:
        userId: 0
        stars: 5
        comment: "This is an example comment"
        complaint: false
    ValidationRequestModel:
      type: object
      properties:
        document:
          type: string
          description: Document proving that a restaurant belongs to a specific vendor
      example:
        document: "VGhlcmUgaXMgbm8gZnJlZSBsdW5jaA=="

    BlockRequestModel:
      type: object
      properties:
        block:
          type: boolean
        id:
          type: integer
          description: id of the user that is making the change
          format: int64
      example:
        block: true
        id: 14

    ActivationRequestModel:
      type: object
      properties:
        activate:
          type: boolean
        id:
          type: integer
          description: id of the user that is making the change
          format: int64
      example:
        activate: true
        id: 14

    #_______________DATABASE_MODELS____________________
    User:
      discriminator:
        propertyName: role
        mapping:
          customer: "#/components/schemas/Customer"
          courier: "#/components/schemas/Courier"
          vendor: "#/components/schemas/Vendor"
          admin: "#/components/schemas/Admin"
      type: object
      properties:
        name:
          type: string
        surname:
          type: string
        id:
          type: integer
          format: int64
        email:
          type: string
        role:
          type: string
          enum: [ customer, courier, vendor, admin ]
        blocked:
          type: boolean
      example:
        name: John
        surname: Doe
        id: 0
        email: "johndoe@example.com"
        role: customer
        blocked: false
    Courier:
      allOf:
        - $ref: '#/components/schemas/User'
      type: object
      properties:
        activated:
          type: boolean
        ratings:
          type: array
          items:
            $ref: '#/components/schemas/Rating'
        wallet:
          $ref: '#/components/schemas/Wallet'
      example:
        name: John
        surname: Doe
        id: 0
        email: "johndoe@example.com"
        role: courier
        blocked: false
        activated: true
        ratings:
          items:
            - userId: 10
              rating: 5
        wallet:
          balance: 0
          iban: "IT60X0542811101000000123455"
    Customer:
      allOf:
        - $ref: '#/components/schemas/User'
      type: object
      properties:
        homeAddress:
          $ref: '#/components/schemas/Address'
        allergens:
          type: array
          items:
            type: string
        paymentMethods:
          type: array
          items:
            $ref: '#/components/schemas/PaymentMethod'
        savedOrder:
          type: integer
          format: int64
        favRestaurants:
          type: array
          items:
            type: integer
            format: int64
      example:
        name: John
        surname: Doe
        id: 0
        email: "johndoe@example.com"
        role: courier
        blocked: false
        homeAddress:
          address: "Via Roma 1"
          city: "Roma"
          country: "Italy"
          postalCode: "00100"
          coordinates:
            lat: 41.902782
            long: 12.496366
        allergens:
          items:
            - "nuts"
        paymentMethods:
          items:
            - creditCardNumber: "1234567890123456"
              cardholderName: "John Doe"
              date: "01/01/2021"
              cvvCode: 123
        savedOrder: 42
        favRestaurants:
          items:
            - 1
            - 2
    Vendor:
      allOf:
        - $ref: '#/components/schemas/User'
      type: object
      properties:
        activated:
          type: boolean
        address:
          $ref: '#/components/schemas/Address'
        openingTimes:
          type: string
        closingTimes:
          type: string
      example:
        name: John
        surname: Doe
        id: 0
        email: "johndoe@example.com"
        role: courier
        blocked: false
        activated: true
        address: 
          address: "Via Roma 1"
          city: "Roma"
          country: "Italy"
          postalCode: "00100"
          coordinates:
            lat: 41.902782
            long: 12.496366
        openingTimes: "mon-fri 10:00, sat-sun 12:00"
        closingTimes: "mon-fri 20:00, sat-sun 22:00"
    Admin:
      allOf:
        - $ref: '#/components/schemas/User'
      example:
        name: John
        surname: Doe
        id: 0
        email: "johndoe@example.com"
        role: courier
        blocked: false

    #_______________OTHER_MODELS____________________
    PaymentMethod:
      type: object
      properties:
        creditCardNumber:
          type: string
        cardholderName:
          type: string
        date:
          type: string
        cvvCode:
          type: integer
          format: int64
      example:
        creditCardNumber: "1234567890123456"
        cardholderName: "John Doe"
        date: "01/01/2021"
        cvvCode: 123
    Wallet:
      type: object
      properties:
        balance:
          type: number
          format: float
        iban:
          type: string
      example:
        balance: 0
        iban: "IT60X0542811101000000123455"
    Address:
      type: object
      properties:
        address:
          type: string
        city:
          type: string
        country:
          type: string
        postalCode:
          type: string
        coordinates:
          $ref: '#/components/schemas/Location'
      example:
        address: "Urtes namai"
        city: "Klaipeda"
        country: "Lithuania"
        postalCode: "LT696969"
        coordinates:
          lat: 69.0
          long: 69.0
    Location:
      type: object
      properties:
        lat:
          type: number
          format: float
        long:
          type: number
          format: float
      example:
        lat: 52.0022
        long: 4.3736
    Validation:
      type: object
      properties:
        vendorId:
          type: integer
          format: int64
        document:
          type: string
          description: Document proving that a restaurant belongs to a specific vendor
      example:
        vendorId: 1234
        document: "string"
    Feedback:
      type: object
      properties:
        id:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        stars:
          type: integer
          format: int64
        comment:
          type: string
        complaint:
          type: boolean
      example:
        id: 123
        userId: 123
        stars: 5
        comment: "This is an example comment"
        complaint: false
    Rating:
      type: object
      properties:
        userId:
          type: integer
          format: int64
        rating:
          type: integer
          format: int64
      example:
        userId: 1
        rating: 5
