openapi: 3.0.3
info:
  title: YumYum user microservice - OpenAPI 3.0
  description: This is the OpenAPI 3.0 specification for the user microservice of the YumYum application.
  version: "1.1"
servers:
  - url: http://localhost:8081/
tags:
  - name: User
  - name: Customer
  - name: Admin
  - name: Vendor
  - name: Courier

paths:

  #____USER____
  /users:
    get:
      tags:
        - User
      summary: Finds all users
      description: returns all users
      operationId: getAllUsers
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
  /user/byEmail/{email}:
    parameters:
      - name: email
        in: path
        description: email of the user
        required: true
        schema:
          type: string
    get:
      tags:
        - User
      summary: Finds user by email
      description: Finds user by email
      operationId: getUserByEmail
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Request doesn't respect the schema
        '404':
          description: User not found
  /user/{userId}:
    parameters:
      - name: userId
        in: path
        description: user ID
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags:
        - User
      summary: Finds user by id
      description: Finds user by id
      operationId: getUserById
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: User not found

  #____CUSTOMER____
  /customers:
    get:
      tags:
        - Customer
      summary: Finds all Customers
      description: returns all customers
      operationId: getAllCustomers
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Customer'
  /customer:
    post:
      tags:
        - Customer
      summary: Create a new Customer account
      description: Create a new Customer account
      operationId: createCustomer
      requestBody:
        description: customer data
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerRegisterRequestModel'
        required: true
      responses:
        '201': #Created
          description: Customer created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400':
          description: Request doesn't respect the schema
        '409':
          description: Customer with that email already exists
  /customer/{userId}:
    parameters:
      - name: userId
        in: path
        description: user ID of customer
        required: true
        schema:
          type: integer
          format: int64
    put:
      tags:
        - Customer
      summary: Update the information of the current customer
      description: Update the information of the current customer by providing object with new info (null means stay the same)
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerRegisterRequestModel'
      responses:
        '200':
          description: Customer updated
        '400':
          description: Request doesn't respect the schema
        '404':
          description: Customer not found
    get:
      tags:
        - Customer
      summary: Get customer by id
      description: Get customer by id
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '404':
          description: Customer not found
    delete:
      tags:
        - Customer
      summary: Delete a customer by id
      description: Delete a customer by id
      responses:
        '200':
          description: Customer deleted
        '404':
          description: Customer not found
  /customer/{userId}/ongoingOrders:
    parameters:
      - name: userId
        in: path
        description: user ID of customer
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags:
        - Customer
      summary: Returns the list of current orders
      description: Returns the list of current order Ids
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                type: array
                items:
                  type: integer
                  format: int64
        '404':
          description: Customer not found
  /customer/{userId}/currentLocation:
    parameters:
      - name: userId
        in: path
        description: user ID of customer
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags:
        - Customer
      summary: Returns current location of the customer
      description: Returns current location of the customer
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Location'
        '404':
          description: Customer not found
  /customer/{userId}/savedOrder:
    parameters:
      - name: userId
        in: path
        description: user ID of customer
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags:
        - Customer
      summary: Returns the saved past order
      description: Returns the saved past order
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                type: integer
                format: int64
        '404':
          description: Customer not found
    put:
      tags:
        - Customer
      summary: updates the saved past order
      description: updates the saved past order
      requestBody:
        content:
          application/json:
            schema:
              type: integer
              format: int64
      responses:
        '200':
          description: Successful
        '404':
          description: Customer not found
  /customer/{userId}/requestRefund/{orderId}:
    parameters:
      - name: userId
        in: path
        description: user ID of customer
        required: true
        schema:
          type: integer
          format: int64
      - name: orderId
        in: path
        description: user ID of customer
        required: true
        schema:
          type: integer
          format: int64

    put:
      tags:
        - Customer
      summary: Request Refund
      description: updates an order to want a refund
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                type: integer
                format : int64
        '404':
          description: order not found

  /customer/{userId}/favRestaurants:
    parameters:
      - name: userId
        in: path
        description: user ID of customer
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags:
        - Customer
      summary: returns a list of favourite restaurants
      description: returns a list of favourite restaurants
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                type: array
                items:
                  type: integer
                  format: int64
        '404':
          description: Customer not found
    put:
      tags:
        - Customer
      summary: updates a list of favourite restaurants
      description: updates a list of favourite restaurants
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: integer
                format: int64
      responses:
        '200':
          description: Successful operation
        '404':
          description: Customer not found
  /customer/{userId}/favOrders:
    parameters:
      - name: userId
        in: path
        description: user ID of customer
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags:
        - Customer
      summary: returns a list of favourite orders
      description: returns a list of favourite orders
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                type: array
                items:
                  type: integer
                  format: int64
        '404':
          description: Customer not found
    put:
      tags:
        - Customer
      summary: updates a list of favourite orders
      description: updates a list of favourite orders
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: integer
                format: int64
      responses:
        '200':
          description: Successful
        '404':
          description: Customer not found
  /customer/{userId}/block:
    parameters:
      - name: userId
        in: path
        description: user ID of customer
        required: true
        schema:
          type: integer
          format: int64
    put:
      tags:
        - Customer
      summary: Block/unblock a customer
      description: Block/unblock a customer
      requestBody:
        description: block/unblock a customer
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Block'
        required: true
      responses:
        '200':
          description: Updated succesfully
        '400':
          description: Request doesn't respect the schema
        '401':
          description: Unauthorized - not an admin
  #____COURIER____
  /couriers:
    get:
      tags:
        - Courier
      summary: Finds all Couriers
      description: returns all couriers
      operationId: getAllCouriers
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Courier'
  /courier:
    post:
      tags:
        - Courier
      summary: Create a new Courier account
      description: Create a new Courier account
      operationId: createCourier
      requestBody:
        description: courier data
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourierRegisterRequestModel'
        required: true
      responses:
        '201': # Created
          description: Courier created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Courier'
        '400':
          description: Request doesn't respect the schema
        '409':
          description: Courier with that email already exists
  /courier/{userId}:
    parameters:
      - name: userId
        in: path
        description: user ID of courier
        required: true
        schema:
          type: integer
          format: int64
    put:
      tags:
        - Courier
      summary: Update the information of the current Courier
      description: Update the information of the current courier by providing new object (null means stay the same)
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Courier'
      responses:
        '200':
          description: Courier updated
        '400':
          description: Request doesn't respect the schema
        '404':
          description: Courier not found
    get:
      tags:
        - Courier
      summary: Get courier by id
      description: Get courier by id
      responses:
        '200':
          description: Courier found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Courier'
        '404':
          description: Courier not found
    delete:
      tags:
        - Courier
      summary: Delete a courier by id
      description: Delete a courier by id
      responses:
        '200':
          description: Courier deleted
        '404':
          description: Courier not found
  /courier/{userId}/pastOrders:
    parameters:
      - name: userId
        in: path
        description: user ID of courier
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags:
        - Courier
      summary: Returns the list of past orders
      description: Returns the list of past order Ids
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                items:
                  type: integer
                  format: int64
  /courier/{userId}/ratings:
    parameters:
      - name: userId
        in: path
        description: user ID of courier
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags:
        - Courier
      summary: Returns the list of ratings
      description: Returns the list of past order Ids
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/Rating'
    put:
      tags:
        - Courier
      summary: Update the list of ratings (admin only)
      description: Update the list of ratings
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  description: User Id of the user issuing the update
                  type: integer
                  format: int64
                ratings:
                  type: array
                  items:
                    $ref: '#/components/schemas/Rating'
      responses:
        '200':
          description: successful operation
        '404':
          description: courier not found
  /courier/{userId}/rate:
    parameters:
      - name: userId
        in: path
        description: user ID of courier
        required: true
        schema:
          type: integer
          format: int64
    post:
        tags:
            - Courier
        summary: Post a rating
        description: Post a rating
        requestBody:
          description: Rating
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rating'
          required: true
        responses:
          '201': # Created
            description: Rating uploaded
          '400':
            description: Request doesn't respect the schema
          '404':
            description: Courier not found

  # This is only accessed by admin
  /courier/{userId}/activation:
    parameters:
      - name: userId
        in: path
        description: user ID of courier
        required: true
        schema:
          type: integer
          format: int64
    put:
      tags:
        - Courier
      summary: Update activation of a courier
      description: Update activation of a courier
      requestBody:
        description: Updates the activation of a courier
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Activation'
        required: true
      responses:
        '200':
          description: Updated successfully
        '400':
          description: Request doesn't respect the schema
        '401':
          description: Unauthorized - not an admin
  # This is only accessed by admin
  /courier/{userId}/block:
    parameters:
      - name: userId
        in: path
        description: user ID of courier
        required: true
        schema:
          type: integer
          format: int64
    put:
      tags:
        - Courier
      summary: Block/unblock a courier
      description: Block/unblock a courier
      requestBody:
        description: block/unblock a courier
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Block'
        required: true
      responses:
        '200':
          description: Updated succesfully
        '400':
          description: Request doesn't respect the schema
        '401':
          description: Unauthorized - not an admin
  #____VENDOR____
  /vendors:
    get:
      tags:
        - Vendor
      summary: Finds all Vendors
      description: returns all vendors
      operationId: getAllVendors
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Vendor'
  /vendor:
    post:
      tags:
        - Vendor
      summary: Create a new Vendor account
      description: Create a new Vendor account
      operationId: createVendor
      requestBody:
        description: vendor data
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VendorRegisterRequestModel'
        required: true
      responses:
        '201': # Created
          description: Vendor created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vendor'
        '400':
          description: Request doesn't respect the schema
        '409':
          description: Vendor with that email already exists
  /vendor/{userId}:
    parameters:
      - name: userId
        in: path
        description: user ID of vendor
        required: true
        schema:
          type: integer
          format: int64
    put:
      tags:
        - Vendor
      summary: Update the information of the current Vendor
      description: Update the information of the current vendor by providing new object (null means stay the same)
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VendorRegisterRequestModel'
      responses:
        '200':
          description: Vendor updated
        '400':
          description: Request doesn't respect the schema
        '404':
          description: Vendor not found
    get:
      tags:
        - Vendor
      summary: Get the information of the current vendor
      description: Get the information of the current vendor by providing id
      responses:
        '200':
          description: Vendor found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vendor'
        '404':
          description: Vendor not found
    delete:
      tags:
        - Vendor
      summary: Delete a vendor by id
      description: Delete a vendor by id
      responses:
        '200':
          description: Vendor deleted
        '404':
          description: Vendor not found
  /vendor/byRadius:
    get:
      tags:
        - Vendor
      summary: Get vendors by radius
      description: Get vendors by radius
      operationId: getVendorsByRadius
      parameters:
        - name: radius
          in: query
          description: radius in km
          required: true
          schema:
            type: integer
            format: int64
        - name: latitude
          in: query
          description: location's latitude
          required: true
          schema:
            type: number
            format: float
        - name: longitude
          in: query
          description: location's longitude
          required: true
          schema:
            type: number
            format: float
      responses:
        '200':
          description: Vendors found
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Vendor'
        '400':
          description: Request doesn't respect the schema
        '404':
          description: Vendors not found
  /vendor/{userId}/validation:
    parameters:
      - name: userId
        in: path
        description: user ID of vendor
        required: true
        schema:
          type: integer
          format: int64
    post:
      tags:
        - Vendor
      summary: Post a validation document
      description: Post a validation document
      requestBody:
        description: Document proving that the restaurant belongs to a vendor
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidationRequestModel'
        required: true
      responses:
        '201': # Created
          description: Validation uploaded
        '400':
          description: Request doesn't respect the schema
        '404':
          description: Vendor not found
    put:
      tags:
        - Vendor
      summary: Update a validation document
      description: Update a validation document
      requestBody:
        description: Document proving that the restaurant belongs to a vendor
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidationRequestModel'
        required: true
      responses:
        '200':
          description: Validation uploaded
        '400':
          description: Request doesn't respect the schema
        '404':
          description: Vendor not found
    get:
      tags:
        - Vendor
      summary: Get a validation document
      description: Get validation document
      responses:
        '200':
          description: Validation found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Validation'
        '404':
          description: Validation or vendor not found
    delete:
      tags:
        - Vendor
      summary: Delete a validation document
      description: Delete validation document
      responses:
        '200':
          description: Validation deleted
        '404':
          description: Validation or vendor not found
  /validations:
    get:
      tags:
        - Vendor
      summary: Get all validation documents
      description: Get all validation documents
      responses:
        '200':
          description: Validations found
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Activation'
  /vendor/{userId}/activation:
    parameters:
      - name: userId
        in: path
        description: user ID of vendor
        required: true
        schema:
          type: integer
          format: int64
    put:
      tags:
        - Vendor
      summary: Update activation of a vendor
      description: Update activation of a vendor
      requestBody:
        description: Updates the activation of a vendor
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Validation'
        required: true
      responses:
        '200':
          description: Updated successfully
        '400':
          description: Request doesn't respect the schema
        '401':
          description: Unauthorized - not an admin
  # This is only accessed by admin
  /vendor/{userId}/block:
    parameters:
      - name: userId
        in: path
        description: user ID of vendor
        required: true
        schema:
          type: integer
          format: int64
    put:
      tags:
        - Vendor
      summary: Block/unblock a vendor
      description: Block/unblock a vendor
      requestBody:
        description: block/unblock a vendor
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Block'
        required: true
      responses:
        '200':
          description: Updated succesfully
        '400':
          description: Request doesn't respect the schema
        '401':
          description: Unauthorized - not an admin
  #____ADMIN____
  /admin:
    post:
      tags:
        - Admin
      summary: Create a new Admin account
      description: Create a new Admin account (only accessible by admins)
      operationId: createAdmin
      requestBody:
        description: admin data
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminRegisterRequestModel'
        required: true
      responses:
        '201': #Created
          description: Admin created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Admin'
        '400':
          description: Request doesn't respect the schema
        '409':
          description: Admin with that email already exists
  /admin/{userId}:
    parameters:
      - name: userId
        in: path
        description: user ID of admin
        required: true
        schema:
          type: integer
          format: int64
    put:
      tags:
        - Admin
      summary: Update the information of the current admin
      description: Update the information of the current admin by providing object with new info (null means stay the same)
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminRegisterRequestModel'
      responses:
        '200':
          description: Admin updated
        '400':
          description: Request doesn't respect the schema
        '404':
          description: Admin not found
    get:
      tags:
        - Admin
      summary: Get the information of the current Admin
      description: Get the information of the current Admin
      responses:
        '200':
          description: Admin found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Admin'
        '404':
          description: Admin not found
    delete:
      tags:
        - Admin
      summary: Delete an admin by id
      description: Delete an admin by id
      responses:
        '200':
          description: Admin deleted
        '404':
          description: Admin not found
  /admin/{userId}/refunds:
    parameters:
      - name: userId
        in: path
        description: user ID of admin
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags:
        - Admin
      summary: Get a list of orders to be refunded
      description: Get the list of orders that have the refund tag set to true
      responses:
        '200':
          description: Orders found
          content:
            application/json:
              schema:
                type: array
                items:
                  type : integer
                  format : int64
        '404':
          description: Request Error
  /admin/{userId}/refund/{orderId}:
    parameters:
      - name: userId
        in: path
        description: user ID of admin
        required: true
        schema:
          type: integer
          format: int64
      - name: orderId
        in: path
        description: user ID of admin
        required: true
        schema:
          type: integer
          format: int64
    put:
      tags:
        - Admin
      summary : Approve or decline a refund
      description: Approve or decline a refund and do said refund
      requestBody:
        description: Refund or not
        content:
          application/json:
            schema:
              type: boolean
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                type: integer
                format: int64
        '404':
          description: Order / Admin Not found

  #____FEEDBACK____
  /feedbacks:
    get:
      tags:
        - Feedback
      summary: Get all feedbacks
      description: Get all feedbacks
      responses:
        '200':
          description: Feedbacks found
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Feedback'
  /feedback:
    post:
      tags:
        - Feedback
      summary: Post a feedback
      description: Post a feedback
      requestBody:
        description: Feedback
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackPostRequestModel'
        required: true
      responses:
        '201': # Created
          description: Feedback uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Feedback'
        '400':
          description: Request doesn't respect the schema
  /feedback/{feedbackId}:
    parameters:
      - name: feedbackId
        in: path
        description: feedback ID
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags:
        - Feedback
      summary: Get a feedback
      description: Get a feedback
      responses:
        '200':
          description: Feedback found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Feedback'
        '404':
          description: Feedback not found
    delete:
      tags:
        - Feedback
      summary: Delete a feedback
      description: Delete a feedback
      responses:
        '200':
          description: Feedback deleted
        '404':
          description: Feedback not found

components:
  schemas:
    #_______________REGISTER_REQUEST_MODELS____________________
    UserRegisterRequestModel:
      type: object
      required:
        - email
        - name
        - surname
      properties:
        email:
          type: string
        name:
          type: string
        surname:
          type: string
    CustomerRegisterRequestModel:
      allOf:
        - $ref: '#/components/schemas/UserRegisterRequestModel'
      type: object
      required:
        - homeAddress
        - allergens
        - paymentMethod
      properties:
        homeAddress:
          $ref: '#/components/schemas/Address'
        allergens:
          type: array
          items:
            type: string
        paymentMethod:
          type: array
          items:
            $ref: '#/components/schemas/PaymentMethod'
    VendorRegisterRequestModel:
      allOf:
        - $ref: '#/components/schemas/UserRegisterRequestModel'
      type: object
      required:
        - address
        - openingTimes
        - closingTimes
      properties:
        address:
          $ref: '#/components/schemas/Address'
        openingTimes:
          type: string
        closingTimes:
          type: string
    CourierRegisterRequestModel:
      allOf:
        - $ref: '#/components/schemas/UserRegisterRequestModel'
      type: object
      properties:
        ibanNumber:
          type: string
    AdminRegisterRequestModel:
      $ref: '#/components/schemas/UserRegisterRequestModel'
    FeedbackPostRequestModel:
      type: object
      required:
        - stars
        - comment
        - complaint
      properties:
        userId:
          type: integer
          format: int64
        stars:
          type: integer
          format: int64
        comment:
          type: string
        complaint:
          type: boolean

    ValidationRequestModel:
      type: object
      properties:
        document:
          type: string
          description: Document proving that a restaurant belongs to a specific vendor


    #_______________DATABASE_MODELS____________________
    User:
      discriminator:
        propertyName: role
        mapping:
          customer: "#/components/schemas/Customer"
          courier: "#/components/schemas/Courier"
          vendor: "#/components/schemas/Vendor"
          admin: "#/components/schemas/Admin"
      type: object
      properties:
        name:
          type: string
        surname:
          type: string
        id:
          type: integer
          format: int64
        email:
          type: string
        role:
          type: string
          enum: [ customer, courier, vendor, admin ]
        blocked:
          type: boolean
    Courier:
      allOf:
        - $ref: '#/components/schemas/User'
      type: object
      properties:
        activated:
          type: boolean
        ratings:
          type: array
          items:
            $ref: '#/components/schemas/Rating'
        wallet:
          $ref: '#/components/schemas/Wallet'
    Customer:
      allOf:
        - $ref: '#/components/schemas/User'
      type: object
      properties:
        homeAddress:
          $ref: '#/components/schemas/Address'
        allergens:
          type: array
          items:
            type: string
        paymentMethod:
          type: array
          items:
            $ref: '#/components/schemas/PaymentMethod'
        savedOrder:
          type: integer
          format: int64
        favRestaurants:
          type: array
          items:
            type: integer
            format: int64
    Vendor:
      allOf:
        - $ref: '#/components/schemas/User'
      type: object
      properties:
        activated:
          type: boolean
        address:
          $ref: '#/components/schemas/Address'
        openingTimes:
          type: string
        closingTimes:
          type: string
    Admin:
      allOf:
        - $ref: '#/components/schemas/User'

    #_______________OTHER_MODELS____________________
    PaymentMethod:
      type: object
      properties:
        creditCardNumber:
          type: string
        cardholderName:
          type: string
        date:
          type: string
        cvvCode:
          type: integer
    Wallet:
      type: object
      properties:
        balance:
          type: number
          format: float
        iban:
          type: string
    Address:
      type: object
      properties:
        address:
          type: string
        city:
          type: string
        country:
          type: string
        postalCode:
          type: string
        coordinates:
          $ref: '#/components/schemas/Location'
    Location:
      type: object
      properties:
        lat:
          type: number
          format: float
        long:
          type: number
          format: float
    Validation:
      type: object
      properties:
        vendorId:
          type: integer
          format: int64
        document:
          type: string
          description: Document proving that a restaurant belongs to a specific vendor
    Feedback:
      type: object
      properties:
        id:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        stars:
          type: integer
          format: int64
        comment:
          type: string
        complaint:
          type: boolean
    Rating:
      type: object
      properties:
        userId:
          type: integer
          format: int64
        rating:
          type: integer
          format: int64
    Block:
      type: object
      properties:
        block:
          type: boolean
        id:
          type: integer
    Activation:
      type: object
      properties:
        activate:
          type: boolean
        id:
          type: integer
          format: int64